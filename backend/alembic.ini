[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# 파일명이 곧 순서다. 리비전 해시만으로는 목록에서 순서를 읽을 수 없다.
#   예) 20260724_1130_a1b2c3d4e5f6_create_users.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

# 마이그레이션 파일이 만들어지는 시각은 UTC로 찍는다 (§2 ADR-02).
timezone = UTC

# ※ sqlalchemy.url을 여기 적지 않는다.
#   접속 정보는 migrations/env.py가 MIGRATION_DATABASE_URL(kbos_owner)에서 읽는다 —
#   ini에 적으면 비밀번호가 리포에 커밋되고, 접속 대상이 두 곳으로 갈라진다.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
