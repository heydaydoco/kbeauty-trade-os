# ============================================================================
# 운영(prod) 환경 — dev와 완전히 분리된 별도 파일 (DESIGN.md §18.2)
#
# 반드시 명시적으로 실행한다 (기본 탐색 경로에 없다 = 실수로 dev에 안 섞인다):
#     docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# dev와의 물리적 격리:
#   - name: kbos-prod 로 컨테이너·볼륨·네트워크가 별도 네임스페이스
#   - 바인드마운트 없음 (소스를 이미지에 굽는다)
#   - db·api 포트 미게시 (외부에 안 열린다). web만 loopback에 게시
#   - 모든 시크릿은 ${VAR:?} 필수변수 문법 — 기본값(:-) 0건.
#     .env.prod가 없거나 값이 비면 기동 자체가 거부된다.
# ============================================================================
name: kbos-prod

services:
  db:
    image: postgres:16.14
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?운영 DB 비밀번호가 필요합니다}
      POSTGRES_DB: postgres
      TZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 포트 미게시 — 내부 네트워크에서만 접근한다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  db-init:
    image: postgres:16.14
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      KBOS_OWNER_PASSWORD: ${KBOS_OWNER_PASSWORD:?운영 owner 비밀번호가 필요합니다}
      KBOS_APP_PASSWORD: ${KBOS_APP_PASSWORD:?운영 app 비밀번호가 필요합니다}
    volumes:
      - ./infra/postgres/init:/init:ro
    restart: "no"
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        for f in /init/*.sql; do
          psql -q -v ON_ERROR_STOP=1 \
               -v owner_pw="$$KBOS_OWNER_PASSWORD" \
               -v app_pw="$$KBOS_APP_PASSWORD" \
               -f "$$f"
        done

  # 마이그레이션은 기본 up에서 제외한다(profiles). 배포 절차에서 수동 실행:
  #   docker compose -f docker-compose.prod.yml --env-file .env.prod --profile migrate run --rm migrate
  migrate:
    build:
      context: ./backend
      target: prod
    profiles: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: prod
      SECRET_KEY: ${SECRET_KEY:?운영 SECRET_KEY가 필요합니다}
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://kbos_app:${KBOS_APP_PASSWORD:?}@db:5432/kbos_dev
      MIGRATION_DATABASE_URL: postgresql+psycopg://kbos_owner:${KBOS_OWNER_PASSWORD:?}@db:5432/kbos_dev
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  api:
    build:
      context: ./backend
      target: prod
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: prod
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:?}
      TZ: UTC
      # 운영 DB 이름도 kbos_dev를 재사용하지 않는다면 여기서 바꾼다.
      DATABASE_URL: postgresql+psycopg://kbos_app:${KBOS_APP_PASSWORD:?}@db:5432/kbos_dev
      MIGRATION_DATABASE_URL: postgresql+psycopg://kbos_owner:${KBOS_OWNER_PASSWORD:?}@db:5432/kbos_dev
      # 업로드 실물 저장 루트 (§4.7 / ADR-0029) — 정적 서빙 경로 밖.
      FILE_STORAGE_ROOT: /data/files
    volumes:
      # 업로드 파일 저장소. named volume이 없으면 컨테이너 재생성 때 파일이
      # 소실된다. 이미지의 /data/files(appuser 소유)가 첫 마운트에 복사되어
      # 비root 실행(uid 10001)에서도 쓰기가 된다. S2-4가 pg_dump와 세트 백업.
      - files_data:/data/files
    # 포트 미게시 — nginx(web)를 통해서만 접근한다.
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      target: prod
    depends_on:
      - api
    volumes:
      # nginx.conf는 이미지에 굽지 않고 read-only로 마운트한다(빌드 컨텍스트 밖).
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # 외부 공개는 리버스 프록시/TLS 종단을 앞에 두는 것을 전제로 loopback에만.
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  pgdata:
  files_data:
