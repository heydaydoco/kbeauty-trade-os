# 운영 nginx — SPA 정적 서빙 + /api 리버스 프록시.
# 프런트와 API가 같은 오리진(같은 호스트:포트)이 되어 CORS가 필요 없다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 업로드 크기 상한 (§18.1 파일 검증과 별개의 1차 방어선)
    client_max_body_size 25m;

    # 정적 자산은 오래 캐시, index.html은 캐시 금지(새 배포 즉시 반영)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: 파일이 없으면 index.html로 (클라이언트 라우팅)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # API 프록시
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 헬스 상세(readyz)는 외부에 노출하지 않는다 — 내부 상태 점검용.
    # 로드밸런서가 필요하면 healthz만 열고 readyz는 내부망에서만 부른다.
    location = /api/v1/system/readyz {
        # 사설 대역에서만 허용
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
}
