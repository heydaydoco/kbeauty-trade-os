name: CI

# push마다 전체 테스트 + 마이그레이션 드라이런 (DESIGN.md §18.3).
# pull_request 트리거는 쓰지 않는다 — required status check는 head SHA의 체크런을
# 보므로 push만으로 PR 게이트가 성립하고, 중복 실행으로 무료 분을 태우지 않는다.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 로컬 compose와 동일 리터럴 태그 (버전 드리프트 방지 — hygiene 잡이 검사)
  POSTGRES_IMAGE: postgres:16.14
  TZ: UTC

jobs:
  # ── 리포 위생 ──────────────────────────────────────────────────────────
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: 인덱스에 CRLF 파일이 없는지
        run: |
          if git ls-files --eol | grep -E '^i/(crlf|mixed)'; then
            echo "::error::CRLF로 커밋된 파일이 있습니다. .gitattributes와 git add --renormalize 확인."
            exit 1
          fi

      - name: 대소문자만 다른 파일명 충돌이 없는지
        run: |
          dups=$(git ls-files | tr 'A-Z' 'a-z' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "::error::대소문자만 다른 파일명은 Windows에서 충돌합니다: $dups"
            exit 1
          fi

      - name: .env 실값이 커밋되지 않았는지
        run: |
          if git ls-files | grep -E '^\.env$|^\.env\.(dev|prod)$'; then
            echo "::error::.env 실값 파일이 추적되고 있습니다."
            exit 1
          fi

      - name: 시크릿 패턴이 섞이지 않았는지 (private 리포는 무료 시크릿 스캔이 없다)
        run: |
          # 마스킹 테스트·구현에는 가짜 키 패턴이 의도적으로 들어 있으므로 제외한다.
          if git grep -nE 'sk-ant-[A-Za-z0-9]{12}|ghp_[A-Za-z0-9]{20}|gho_[A-Za-z0-9]{20}' -- . \
               ':!*.yml' ':!backend/tests' ':!backend/app/core/logging/redaction.py'; then
            echo "::error::API 키/토큰으로 보이는 문자열이 있습니다."
            exit 1
          fi

      - name: PostgreSQL 태그가 compose와 CI에서 일치하는지
        run: |
          compose_tag=$(grep -hoE 'postgres:16\.[0-9]+' docker-compose.yml docker-compose.prod.yml | sort -u)
          count=$(echo "$compose_tag" | wc -l)
          if [ "$count" -ne 1 ] || [ "postgres:16.14" != "$compose_tag" ]; then
            echo "::error::postgres 태그 불일치. compose=$compose_tag / CI=postgres:16.14"
            exit 1
          fi

      - name: Tailwind v4 규율 (설정 파일이 없어야 한다)
        run: |
          if ls frontend/tailwind.config.* 2>/dev/null; then
            echo "::error::Tailwind v4는 CSS-first다. tailwind.config.*가 있으면 안 된다."
            exit 1
          fi

  # ── 백엔드 정적 검사 + 마이그레이션 드라이런 (샤드와 병렬, 1회만) ──────────
  # 린트·타입·드라이런 4종은 테스트 샤드마다 반복할 이유가 없어 경량 잡 하나로 뺐다(ADR-0072).
  # 이 목록에서 검사가 빠지거나 샤드로 중복되면 test_ci_contract.py가 잡는다.
  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_PASSWORD: ci_postgres_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KBOS_OWNER_PASSWORD: ci_owner_pw
      KBOS_APP_PASSWORD: ci_app_pw
      APP_ENV: test
      SECRET_KEY: ci_test_secret_key_0123456789abcdefgh
      DATABASE_URL: postgresql+psycopg://kbos_app:ci_app_pw@localhost:5432/kbos_dev
      MIGRATION_DATABASE_URL: postgresql+psycopg://kbos_owner:ci_owner_pw@localhost:5432/kbos_dev
      TEST_DATABASE_URL: postgresql+psycopg://kbos_app:ci_app_pw@localhost:5432/kbos_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://kbos_owner:ci_owner_pw@localhost:5432/kbos_test
      MIGRATION_CHECK_DATABASE_URL: postgresql+psycopg://kbos_owner:ci_owner_pw@localhost:5432/kbos_migr
    steps:
      - uses: actions/checkout@v5

      - name: DB 부트스트랩 (로컬과 동일한 init SQL을 psql로 실행)
        env:
          PGPASSWORD: ci_postgres_pw
        run: |
          # CI 전용 속도 설정 — 일회용 DB라 내구성(fsync)이 필요 없다(PR #42 선례). 운영 DB와 무관.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
               -c "ALTER SYSTEM SET fsync = off" \
               -c "ALTER SYSTEM SET synchronous_commit = off" \
               -c "ALTER SYSTEM SET full_page_writes = off" \
               -c "SELECT pg_reload_conf()"
          for f in infra/postgres/init/*.sql; do
            echo "== $f"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
                 -v owner_pw="$KBOS_OWNER_PASSWORD" \
                 -v app_pw="$KBOS_APP_PASSWORD" \
                 -f "$f"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 의존성 설치
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: 린트 (ruff)
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: 타입 (mypy)
        working-directory: backend
        run: mypy app

      - name: 마이그레이션 드라이런 4종 (kbos_migr — pytest DB와 분리)
        working-directory: backend
        env:
          ALEMBIC_DATABASE_URL: postgresql+psycopg://kbos_owner:ci_owner_pw@localhost:5432/kbos_migr
        run: |
          heads=$(alembic heads | grep -c '(head)')
          [ "$heads" -eq 1 ] || { echo "::error::alembic head가 $heads개 (1개여야 함)"; exit 1; }
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

  # ── 백엔드 테스트 — 파일 단위 샤드 (ADR-0072) ─────────────────────────────
  # 테스트 4,500+건을 한 러너에서 직렬로 돌리면 PR마다 20~25분, 느린 날은 60분 한도에 걸렸다
  # (15분→30분→60분 연속 상향 — PR-7b·PR-11b·PR #42). 테스트 파일을 tests/.shard_durations.json의
  # 실측 소요 시간으로 N개 샤드에 LPT 배정한다(tests/support/sharding.py — 파일 단위라 모듈 픽스처 보존).
  # 샤드마다 커버리지 데이터만 모으고, 94% 게이트·샤드 완전성 대조는 backend-coverage 잡이 병합 후 건다.
  # 샤드를 늘리려면 matrix.shard에 번호만 추가한다 — N은 strategy.job-total에서 자동으로 따라온다.
  backend:
    runs-on: ubuntu-latest
    # 샤드당 40분: 평소 샤드 테스트는 직렬 20~25분의 1/3(약 7~9분)+셋업 2~3분이다. 40분은 평소의 3~4배라
    # 느린 러너(PR #42는 평소의 2.5배)도 넘기고, 행 걸림은 종전 60분보다 일찍 끊는다. 샤드가 40분에
    # 닿으면 한도를 올리지 말고 샤드 수를 늘린다.
    timeout-minutes: 40
    strategy:
      # 한 샤드가 실패해도 나머지는 끝까지 돌려 실패 전체를 한 번에 본다(병합 판정은 ci-ok가 한다).
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_PASSWORD: ci_postgres_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # 로컬과 같은 역할·DB 구조. 비밀번호만 CI 전용.
      KBOS_OWNER_PASSWORD: ci_owner_pw
      KBOS_APP_PASSWORD: ci_app_pw
      APP_ENV: test
      SECRET_KEY: ci_test_secret_key_0123456789abcdefgh
      DATABASE_URL: postgresql+psycopg://kbos_app:ci_app_pw@localhost:5432/kbos_dev
      MIGRATION_DATABASE_URL: postgresql+psycopg://kbos_owner:ci_owner_pw@localhost:5432/kbos_dev
      TEST_DATABASE_URL: postgresql+psycopg://kbos_app:ci_app_pw@localhost:5432/kbos_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://kbos_owner:ci_owner_pw@localhost:5432/kbos_test
      MIGRATION_CHECK_DATABASE_URL: postgresql+psycopg://kbos_owner:ci_owner_pw@localhost:5432/kbos_migr
      # 백업·복원 리허설 스크립트 테스트(pg_dump·openssl 필요)가 skip으로 조용히 사라지지 않게 한다 — 없으면 실패.
      # 모든 샤드에 건다(어느 샤드에 배정되든 같은 가드).
      KBOS_REQUIRE_SCRIPT_TESTS: "1"
      # 샤드 지정 "i/N" — 이 값이 있을 때만 tests/support/sharding.py가 켜진다(로컬 기본은 전체 실행).
      KBOS_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      # 배정 보고서(수집 전체·배정 파일) — backend-coverage 잡이 독립 수집과 대조한다.
      KBOS_TEST_SHARD_REPORT: shard-report-${{ matrix.shard }}.json
      # 샤드마다 고유한 커버리지 데이터 파일 — backend-coverage 잡이 coverage combine으로 병합한다.
      COVERAGE_FILE: .coverage.shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5

      - name: DB 부트스트랩 (로컬과 동일한 init SQL을 psql로 실행)
        env:
          PGPASSWORD: ci_postgres_pw
        run: |
          # CI 전용 속도 설정 — 테스트는 일회용 DB라 내구성(fsync)이 필요 없다. 느린 러너에서 체크포인트가
          # 49초씩 걸려 백엔드 잡이 60분 한도에 걸린 선례(PR #42, 2026-10-01). 운영 DB와 무관(CI 서비스 컨테이너만).
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
               -c "ALTER SYSTEM SET fsync = off" \
               -c "ALTER SYSTEM SET synchronous_commit = off" \
               -c "ALTER SYSTEM SET full_page_writes = off" \
               -c "SELECT pg_reload_conf()"
          for f in infra/postgres/init/*.sql; do
            echo "== $f"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
                 -v owner_pw="$KBOS_OWNER_PASSWORD" \
                 -v app_pw="$KBOS_APP_PASSWORD" \
                 -f "$f"
          done

      - name: PostgreSQL 클라이언트(pg_dump·pg_restore) 확인 — 백업·복원 리허설 스크립트 테스트용
        run: |
          if ! command -v pg_dump >/dev/null || ! pg_dump --version | grep -qE ' 16\.'; then
            sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-16 || sudo apt-get install -y -q postgresql-client
          fi
          pg_dump --version
          openssl version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 의존성 설치
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: 테스트 (샤드 — 커버리지 데이터만 수집, 94% 게이트는 backend-coverage 잡이 병합 후)
        working-directory: backend
        run: pytest -ra --cov=app --cov-report= --junitxml=junit-shard-${{ matrix.shard }}.xml -o junit_family=xunit1

      # 실패해도 올린다(junit으로 원인 확인). .coverage.*는 숨김 파일이라 include-hidden-files가 없으면 빠진다.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-shard-${{ matrix.shard }}
          path: |
            backend/.coverage.shard-${{ matrix.shard }}
            backend/shard-report-${{ matrix.shard }}.json
            backend/junit-shard-${{ matrix.shard }}.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # ── 샤드 완전성 대조 + 커버리지 병합·게이트 94% (ADR-0031·ADR-0072) ─────────
  # 샤드가 전부 성공해야 돈다(아니면 skipped → ci-ok 실패). DB 없이 수집·병합만 한다.
  backend-coverage:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # --collect-only는 DB에 붙지 않지만 conftest 가드(APP_ENV=test·TEST_DATABASE_URL)와 설정 검증은 값을 요구한다.
      APP_ENV: test
      SECRET_KEY: ci_test_secret_key_0123456789abcdefgh
      DATABASE_URL: postgresql+psycopg://kbos_app:ci_app_pw@localhost:5432/kbos_dev
      MIGRATION_DATABASE_URL: postgresql+psycopg://kbos_owner:ci_owner_pw@localhost:5432/kbos_dev
      TEST_DATABASE_URL: postgresql+psycopg://kbos_app:ci_app_pw@localhost:5432/kbos_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://kbos_owner:ci_owner_pw@localhost:5432/kbos_test
      MIGRATION_CHECK_DATABASE_URL: postgresql+psycopg://kbos_owner:ci_owner_pw@localhost:5432/kbos_migr
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 의존성 설치
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: backend-shard-*
          path: backend/shard-data
          merge-multiple: true

      - name: 샤드 완전성 (합집합 = 독립 전체 수집 · 교집합 = ∅ · 샤드 1..N 전부 — 아니면 실패)
        working-directory: backend
        run: |
          # 샤드 플러그인이 꺼진 상태(KBOS_TEST_SHARD 없음)의 독립 수집과 각 샤드 보고서를 대조한다.
          pytest --collect-only -q -p no:cacheprovider > shard-data/collect-only.txt
          python -m tests.support.shard_tools verify --collect-only shard-data/collect-only.txt shard-data/shard-report-*.json

      - name: 커버리지 병합 + 게이트 94% (ADR-0031 — S2-1 판정 조건 10)
        working-directory: backend
        run: |
          shopt -s nullglob
          reports=(shard-data/shard-report-*.json)
          data=(shard-data/.coverage.shard-*)
          if [ "${#data[@]}" -ne "${#reports[@]}" ]; then
            echo "::error::커버리지 데이터 ${#data[@]}개 ≠ 샤드 보고서 ${#reports[@]}개 — 빠진 샤드의 커버리지 없이 게이트를 통과할 수 없다."
            exit 1
          fi
          coverage combine "${data[@]}"
          coverage report -m --fail-under=94
          coverage xml -o coverage.xml

      - name: 샤드 소요 시간 갱신본 (CI 실측 — 균형이 나빠지면 이 아티팩트로 tests/.shard_durations.json 교체)
        working-directory: backend
        run: python -m tests.support.shard_tools durations shard-data/junit-shard-*.xml --output shard-durations.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: shard-durations
          path: backend/shard-durations.json
          retention-days: 7

  # ── 프런트엔드 ─────────────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 타입체크
        run: npm run typecheck
      # eslint는 Phase 1로 이월 — typescript-eslint가 TypeScript 7(네이티브 컴파일러)을
      # 아직 지원하지 않는다(peer <6.1.0). tsc strict가 골격 단계의 게이트다.
      - name: 테스트
        run: npm run test -- --run
      - name: 빌드
        run: npm run build

  # ── compose 문법 (dev·prod 둘 다) ────────────────────────────────────────
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: dev·prod compose 렌더 검증
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.prod.yml --env-file .env.prod.example config -q
          rm -f .env

  # ── compose 스모크 (부채 #5 종결 — S1.5 판정 ⑦, 범위 최소 4항) ──────────
  # `docker compose up` 한 번으로 서는가(영준이의 첫 실행 경로)의 회귀 검사.
  # 검사는 4항뿐이다: 스택 기동 · 준비 확인(readyz) · 비인증 401 · 파일 업로드
  # 왕복 1건. 기능 검증은 pytest(백엔드 잡)의 몫이고 여기서는 조립만 본다.
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: 스택 기동 (dev compose 그대로)
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: 준비 확인 (readyz 200 — DB 연결+마이그레이션 최신까지 포함하는 게이트)
        run: |
          code=000
          for i in $(seq 1 60); do
            # --max-time: 연결 후 응답이 행에 걸리면 이 한 번의 curl이 잡 타임아웃까지
            # 매달려 아래 진단 출력이 통째로 소실된다(리뷰 확정 발견).
            code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/system/readyz || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "::error::readyz가 120초 안에 200이 되지 않았습니다(마지막 응답 $code)."
            docker compose ps
            docker compose logs db-init migrate api | tail -80
            exit 1
          fi
          # web은 단언 없이 기동 여부만 본다 — 스택 기동 항목의 일부다.
          state=$(docker compose ps web --format '{{.State}}')
          [ "$state" = "running" ] || { echo "::error::web 컨테이너 상태: $state"; exit 1; }

      - name: 비인증 401 (§18.1 — 공개 경로 밖은 전부 인증)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/documents)
          if [ "$code" != "401" ]; then
            echo "::error::비인증 documents 응답이 $code (401이어야 함)"
            exit 1
          fi

      - name: 파일 업로드 왕복 1건 (§4.7 — 업로드→다운로드 바이트 일치)
        run: |
          set -euo pipefail
          # --no-deps: 스택은 이미 떠 있다 — 원샷(db-init·migrate) 재기동을 피한다.
          docker compose run --rm --no-deps api python -m app.cli create-admin \
            --email smoke@ci.local --password 'smoke-ci-password-1234' --display-name smoke
          curl -sf -c /tmp/cj -X POST http://localhost:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@ci.local","password":"smoke-ci-password-1234"}' > /dev/null
          post() { curl -sf -b /tmp/cj -X POST "http://localhost:8000/api/v1/$1" \
                     -H 'Content-Type: application/json' -H "Idempotency-Key: smk-$1" -d "$2"; }
          brand_id=$(post brands '{"brand_code":"SMK-CI-B1","name_ko":"스모크 브랜드"}' | jq .id)
          product_id=$(post products "{\"brand_id\":$brand_id,\"product_code\":\"SMK-CI-P1\",\"name_ko\":\"스모크 제품\"}" | jq .id)
          sku_id=$(post skus "{\"sku_code\":\"SMK-CI-S1\",\"name_ko\":\"스모크 SKU\",\"kind\":\"SINGLE\",\"product_id\":$product_id}" | jq .id)
          printf '%%PDF-1.4 compose-smoke roundtrip payload' > /tmp/smoke-msds.pdf
          doc_id=$(curl -sf -b /tmp/cj -X POST http://localhost:8000/api/v1/documents/files \
            -H 'Idempotency-Key: smk-doc1' \
            -F 'file=@/tmp/smoke-msds.pdf;type=application/pdf' \
            -F owner_type=SKU -F owner_id="$sku_id" -F document_type=MSDS | jq .id)
          curl -sf -b /tmp/cj "http://localhost:8000/api/v1/documents/$doc_id/download" -o /tmp/roundtrip.pdf
          cmp /tmp/smoke-msds.pdf /tmp/roundtrip.pdf
          echo "업로드 왕복 바이트 일치 (document id=$doc_id)"

  # ── 단일 게이트 ────────────────────────────────────────────────────────
  # 룰셋의 required check는 이 하나만 지정한다. 잡을 추가/이름변경해도
  # 룰셋을 건드릴 필요가 없다. (test_ci_contract.py가 needs 누락을 검사)
  ci-ok:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: always()
    # backend는 매트릭스 전체(샤드 하나라도 실패하면 failure), backend-coverage는 병합·94% 게이트·샤드 완전성.
    needs: [hygiene, backend-checks, backend, backend-coverage, frontend, compose, compose-smoke]
    steps:
      - name: 모든 잡이 성공했는지
        run: |
          # needs 전체를 자동으로 본다 — needs에 잡을 넣고 이 목록 갱신을 잊어 실패가 새는 일이 없게.
          results="${{ join(needs.*.result, ' ') }}"
          echo "결과: $results"
          if [ -z "$results" ]; then
            echo "::error::선행 잡 결과가 비어 있습니다 — 아무것도 확인하지 못한 채 통과할 수 없다."
            exit 1
          fi
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::선행 잡 중 실패가 있습니다: $results"
              exit 1
            fi
          done
          echo "모든 잡 통과."
